[package]
name = "wasm-git"
version = "0.1.0"
edition = "2021"
description = "Lossless core WebAssembly auditing and decentralized version history"

[dependencies]
wasmparser = "=0.249.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
similar = "2"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
ignore = "=0.4.33"
globset = "=0.4.20"

[dev-dependencies]
wat = "=1.249.0"
wast = "=249.0.0"

[patch.crates-io]
wasmparser = { path = "vendor/wasmparser" }
